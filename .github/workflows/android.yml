name: Build Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {} # lets us test a fix on demand without cutting a release tag

permissions:
  contents: write

# Used to share ONE group name across all four platform workflows
# (android/ios/windows/macos.yml) on purpose, to serialize their shared
# GitHub Release upload (via softprops/action-gh-release) and avoid two
# of them racing to create/update it at once.
#
# That backfired: a concurrency group cancels any run that's merely
# *pending* (queued, not yet started) as soon as a newer run for the same
# group is queued -- cancel-in-progress: false only protects a run
# that's already *in_progress*. With all four workflows firing within
# the same second for one tag push, that deterministically cancelled two
# of the four on every single release (confirmed on the v2.9.0 tag:
# Windows and macOS were both cancelled before they ever started, while
# Android and iOS ran). Scoping the group per platform fixes that -- each
# workflow now only ever collides with an earlier run of *itself* (e.g. a
# manual re-run while the previous attempt is still going), so all four
# actually run in parallel. softprops/action-gh-release already reuses an
# existing release for the tag rather than failing when one's already
# there, which is the only cross-workflow coordination this needs.
concurrency:
  group: release-android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # android/ IS committed now (unlike before) — Health Connect needs
      # persistent permissions in AndroidManifest.xml and a minSdk bump,
      # which a fresh `flutter create` on every run would silently wipe.
      - run: flutter pub get

      # Reconstructs the persistent release keystore from repo secrets --
      # without this, `flutter build apk --release` falls back to signing
      # with a debug key, and every CI runner starts with no persistent
      # ~/.android/debug.keystore (fresh VM each run), so every such build
      # would get a *different* random signature. That silently breaks the
      # in-app updater: Android refuses to install an update signed with a
      # different key than what's already on the phone ("package conflicts
      # with an existing package"). Missing secrets (e.g. a fork without
      # them configured) leaves key.properties absent, and the Gradle
      # config falls back to the debug key exactly as it did before this
      # was added -- the build still succeeds, it just won't cleanly
      # update an install signed with the real release key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured -- falling back to debug signing (see build.gradle.kts)."
            exit 0
          fi
          # A previous run failed here with a bare "exit code 1" and no
          # visible reason (logs are hidden from signed-out viewers) --
          # base64 -d aborts on anything outside the base64 alphabet, which
          # is exactly what you get if the secret was captured with a tool
          # that wraps output in PEM-style "-----BEGIN CERTIFICATE-----"
          # headers (e.g. Windows' certutil -encode) instead of a plain
          # base64 dump. Fail loudly with a specific reason instead of a
          # bare exit code, so this is diagnosable from the Actions summary
          # without needing to sign in to view raw logs.
          #
          # `tr -d '[:space:]'` first: pasting the secret via the GitHub
          # web UI (or a Windows-generated source file) can carry a
          # trailing/embedded \r or \n that isn't part of the base64
          # alphabet -- strip all whitespace unconditionally rather than
          # failing on an artifact that has nothing to do with whether the
          # underlying keystore data is actually valid.
          if ! echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release-keystore.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is set but isn't valid base64 (decode failed). Regenerate it from the keystore file with a plain base64 dump -- e.g. in PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('release-keystore.jks')) | Set-Content -NoNewline keystore_base64.txt -- and NOT with certutil -encode, which wraps the output in -----BEGIN/END CERTIFICATE----- lines that aren't valid base64. Paste the resulting file's contents into the secret."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      # Release builds get their version from the tag that triggered them
      # (v1.2.3 -> 1.2.3), not pubspec.yaml's version: field -- so cutting a
      # release is just "push a tag", nothing to hand-edit first. A manual
      # workflow_dispatch run (no tag) falls back to whatever pubspec.yaml
      # already has, since that's just a test build.
      - name: Build APK
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            flutter build apk --release --build-name="${GITHUB_REF_NAME#v}"
          else
            flutter build apk --release
          fi
        shell: bash

      # The home-screen icon follows the app's appearance by switching
      # between <activity-alias> entries, one per icon variant, which only
      # release builds get (android/app/src/release/AndroidManifest.xml).
      # A mistake there doesn't fail the build -- it ships an APK that shows
      # two Ironpeak icons on the home screen, or none at all -- so check the
      # manifest that actually got merged into the APK before it's uploaded
      # or released. The script finds aapt2 in the runner's preinstalled
      # Android SDK (ANDROID_HOME, newest build-tools); it's dart:io-only, so
      # plain `dart` instead of `dart run`, which would first run the build
      # hooks of the app's native dependencies for nothing.
      - name: Verify launcher aliases
        run: |
          set -euo pipefail
          if [ ! -d "${ANDROID_HOME:-}/build-tools" ]; then
            echo "::error::No Android SDK build-tools under ANDROID_HOME (${ANDROID_HOME:-unset}) -- the launcher alias check needs aapt2 from there."
            exit 1
          fi
          dart tool/verify_launcher_aliases.dart --release build/app/outputs/flutter-apk/app-release.apk
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ironpeak-fitness-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
