name: Deploy website to GitHub Pages

# Publishes website/ (plain HTML/CSS/JS, no build step) whenever it changes
# on master. Also re-runs when the exercise database changes, because the
# page shows its live exercise count.
on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - 'mobile/assets/exercises.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push queues behind a running one
# instead of cancelling it halfway through a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # The page itself only uses relative URLs, so it works under any base
      # path. Only the absolute ones (canonical, og:image, sitemap, the 404
      # page's links) need the real address -- taken from the Pages config,
      # so it is right for a custom domain and for <user>.github.io/<repo>.
      - name: Prepare site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r website _site
          rm -rf _site/README.md _site/tools

          SITE_URL="${SITE_URL%/}"
          FILES="$(grep -rl '__SITE_URL__' _site || true)"
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i "s#__SITE_URL__#${SITE_URL}#g"
          fi

          COUNT="$(jq '.exercises | length' mobile/assets/exercises.json)"
          if [[ "$COUNT" =~ ^[0-9]+$ ]] && (( COUNT > 0 )); then
            sed -i -E "s#(data-exercise-count>)[0-9]+#\1${COUNT}#g" _site/index.html
          fi

          echo "Site URL: ${SITE_URL}"
          echo "Exercises: ${COUNT}"
          if grep -rl '__SITE_URL__' _site; then
            echo "::error::Unreplaced __SITE_URL__ placeholder left in the files above"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
